<!DOCTYPE html>
<html>
    <head>
        <style>
            html{
                height: 100%;
                background-color: #0ff;
                overflow-y: hidden;
                overflow-x: hidden;
            }

            h1 {
                font-size: large;
                position: absolute;
                pointer-events: none;
                font-family: Arial, Helvetica, sans-serif;
                color:#fff;
                z-index:100;
                
            }

            h2 {
                font-size: 1.2vw;
                position: absolute;
                pointer-events: none;
                font-family: Arial, Helvetica, sans-serif;
                color:#fff;
                z-index:100;
                text-shadow: rgba(255,18,192,0.9) 0px 0px 39px;
                
            }

            .bg {
                width: 100%;
                height: 100%;
                position: absolute;
                left: 0px;
                top: 0px;
                z-index: -1;
                animation-name: fade;
                animation-duration: 2s;
                animation-iteration-count: 1;
            }

            .stretch {
             width: 100%;
            height: 100%;
            }
            
            h1 {
                width: 40%;
                font-size: large;
                position: absolute;
                pointer-events: none;
                font-family: Arial, Helvetica, sans-serif;
                color:#fff;
                z-index:100;
                
            }

            #bio {
                left: 4%;
                top: 75%;
                animation-name: slide, fade;
                animation-duration: 2s;
                animation-iteration-count: 1;
            }

            img:hover {
                opacity: 50%;
            }
            
            @keyframes slide {
                from {
                    transform: translate(-50%);
                }

                to {
                    transform: translate(0%);
                }
            }
            
            @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
            }

            @keyframes fade {
                from {
                    opacity: 0%;
                }

                to {
                    opacity: 100%;
                }
            }

            .glow {
                animation: glow 1s ease-in-out infinite alternate;
            }

            @keyframes glow {
              from {
             text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073, 0 0 50px #e60073, 0 0 60px #e60073, 0 0 70px #e60073;
            }
  
            to {
             text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6, 0 0 50px #ff4da6, 0 0 60px #ff4da6, 0 0 70px #ff4da6, 0 0 80px #ff4da6;
            }
            }

            #contact,
            #instagram,
            #home,
            #books,
            #about {
                position: absolute;
                width: 7%;
                aspect-ratio: 1 / 1;
                z-index: 100;
                animation-name: slide, fade;
                animation-duration: 2s;
                animation-iteration-count: 1;
            }

            #contact  { top: 88%; left: 4%;}
            #instagram  { top: 88%; left: 12%;} 
            #about  { top: 88%; left: 20%;}
            #books  { top: 88%; left: 28%;}
            #home  { top: 88%; left: 36%;} 

            #contact img,
            #instagram img,
            #about img,
            #books img,
            #home img {
                position: absolute;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            #contact:hover,
            #instagram:hover,
            #home:hover,
            #books:hover,
            #about:hover {
                opacity: 50%;
            }

            #instagram h2,
               #contact h2,
               #about h2,
               #books h2,
               #home h2 {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    margin: 0;
                    width: 100%;
                    text-align: center;
                    font-size: 1vw;
                    pointer-events: none;
                }


            #sleepingB {
                position: absolute;
                width:auto;
                height: 50%;
                top: 0%;
                left:0%;
            }

            #cryonicsI {
                position: absolute;
                width:auto;
                height: 50%;
                top: 0%;
                left:33%;
            }
           
            #fruit {
                position: absolute;
                background-color: green;
                opacity: 50%;
                width:17%;
                height: 25%;
                top: 17%;
                left:54%;
            }
            on:hover {
                cursor: pointer;
            }

        </style>
    </head>
    <body>
